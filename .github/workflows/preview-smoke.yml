name: Preview HTTP acceptance

on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: 'Exact SCES Vercel preview URL (no credentials)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  preview-http:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Read-only health, readiness, auth boundary and login checks
        env:
          PREVIEW_URL: ${{ inputs.deployment_url }}
          # Optional authenticated access to Vercel-protected previews. Never
          # disable project protection or send this secret through inputs.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/check-deployed-api.mjs
